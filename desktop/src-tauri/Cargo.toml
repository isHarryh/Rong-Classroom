[package]
name = "rong-classroom-desktop"
version = "0.1.0"
description = "Rong Classroom Desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
